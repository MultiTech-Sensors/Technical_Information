name: Build Sensor Decoder Custom App

on:
  push:
    branches: [main]
    paths:
      - 'BACNet.zip'
      - 'MTCT300_direct.zip'
      - 'bacnet-app/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dos2unix
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dos2unix

      - name: Build package
        id: build
        run: |
          chmod +x bacnet-app/package.sh
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            bacnet-app/package.sh "${{ github.event.inputs.version }}"
          else
            bacnet-app/package.sh
          fi
          TGZ=$(ls bacnet-app/dist/sensor-decoders_*.tgz)
          VERSION=$(basename "$TGZ" .tgz | sed 's/^sensor-decoders_//')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tgz=${TGZ}" >> "$GITHUB_OUTPUT"
          echo "Built version: ${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.build.outputs.version }}
          name: Sensor Decoders v${{ steps.build.outputs.version }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          body: |
            ## Sensor Decoder Definitions Custom App

            LoRaWAN sensor decoder definitions for mPower Payload Management.

            **Sensors included:**
            - Radio Bridge RBS 301, 304, and 306 series (BACNet)
            - MultiTech MTCT300 current transformer

            ### Installation
            Upload `sensor-decoders_${{ steps.build.outputs.version }}.tgz` via Device Manager or install manually:
            ```
            app-manager --command install --appid <UUID> --appfile /tmp/sensor-decoders_${{ steps.build.outputs.version }}.tgz
            ```
          files: ${{ steps.build.outputs.tgz }}
          generate_release_notes: true
